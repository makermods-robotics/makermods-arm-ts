<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arm console</title>
    <link rel="stylesheet" href="../shared/style.css" />
  </head>
  <body>
    <nav><a href="../">All apps</a></nav>
    <h1>Arm console</h1>
    <p>Metal or Maker Arm on a candleLight USB-CAN adapter over WebUSB, or on an SLCAN adapter over Web Serial.</p>
    <fieldset>
      <legend>Adapter</legend>
      <select id="product" aria-label="Arm">
        <option value="metal">Metal Arm</option>
        <option value="maker">Maker Arm</option>
      </select>
      <select id="link" aria-label="Adapter">
        <option value="gs_usb">candleLight (WebUSB)</option>
        <option value="slcan">SLCAN (Web Serial)</option>
      </select>
      <button id="connect">Connect</button>
      <button id="disconnect" disabled>Disconnect</button>
    </fieldset>
    <fieldset>
      <legend>Motion</legend>
      <button id="enable" disabled>Enable (hold)</button>
      <label>Joint <select id="joint" disabled></select></label>
      <label>by <input id="delta" type="number" value="0.3" step="0.05" /> rad</label>
      <button id="move" disabled>Move</button>
      <button id="sine" disabled>Sine wave</button>
      <button id="rest" disabled>Rest and release</button>
      <button id="estop" class="stop" disabled>E-stop</button>
    </fieldset>
    <p>State: <span id="state" class="state">not connected</span> <span id="fault"></span></p>
    <p id="message" role="status"></p>
    <p>Target: <code id="target">-</code></p>
    <table>
      <thead><tr><th>Joint</th><th>Position (deg)</th><th>Temp (C)</th><th>Torque</th><th>Fault</th></tr></thead>
      <tbody id="joints"></tbody>
    </table>
    <pre id="log" aria-label="Log"></pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
