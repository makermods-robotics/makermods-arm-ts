<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SO-101 console</title>
    <link rel="stylesheet" href="../shared/style.css" />
  </head>
  <body>
    <nav><a href="../">All apps</a></nav>
    <h1>SO-101 console</h1>
    <p>An SO-101 (six Feetech servos) on its USB serial adapter, over Web Serial. The calibration is kept in this browser.</p>
    <fieldset>
      <legend>Port</legend>
      <button id="connect">Connect</button>
      <button id="disconnect" disabled>Disconnect</button>
      <button id="wiggle" disabled>Wiggle gripper</button>
    </fieldset>
    <fieldset>
      <legend>Calibration (by hand)</legend>
      <button id="calibrate" disabled>Calibrate</button>
      <button id="save" disabled>Save calibration</button>
      <button id="cancel" disabled>Cancel</button>
      <p>Calibration: <span id="calibration">-</span></p>
      <table>
        <thead><tr><th>Joint</th><th>Min</th><th>Max</th><th>Now</th></tr></thead>
        <tbody id="ranges"></tbody>
      </table>
    </fieldset>
    <fieldset>
      <legend>Motion</legend>
      <button id="enable" disabled>Enable (hold)</button>
      <label>Joint <select id="joint"></select></label>
      <label>by <input id="delta" type="number" value="0.3" step="0.05" /> rad</label>
      <button id="move" disabled>Move</button>
      <button id="rest" disabled>Rest and release</button>
      <button id="estop" class="stop" disabled>E-stop</button>
    </fieldset>
    <p>State: <span id="state" class="state">not connected</span> <span id="fault"></span></p>
    <p id="message" role="status"></p>
    <p>Target: <code id="target">-</code></p>
    <table>
      <thead><tr><th>Joint</th><th>Position (deg)</th><th>Temp (C)</th><th>Torque</th><th>Fault</th></tr></thead>
      <tbody id="joints"></tbody>
    </table>
    <pre id="log" aria-label="Log"></pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
